{% extends "base.html" %}
{% block title %}Report {{ target_type }}{% endblock %}
{% block content %}
    <h2>Report {{ target_type }}</h2>
    <form method="POST">
        <p><strong>Reason for reporting:</strong></p>
        <textarea name="reason" rows="4" cols="40" required></textarea><br><br>
        <button type="submit">Submit Report</button>
    </form>
{% endblock %}
