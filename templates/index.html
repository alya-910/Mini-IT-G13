{% extends 'base.html' %}

{% block body %}

  <div class="top-bar"><a href="{{ url_for('cart.view_cart') }}" class="cart-button">
  My Wishlist
  </a>
  </div>

  <div class="page-container">

    <h1>m a r k e t p l a c e</h1>

    <p>
      <a class="upload-link" href="{{ url_for('item.upload_item') }}">
        Upload new item
      </a>
    </p>

    <div class="item-grid">
      {% for item in items %}
        <div class="item-card">

          <a href="{{ url_for('item.item_detail', item_id=item.id) }}" width="200">
            <img
              src="{{ url_for('static', filename=item.image_path) }}"
              alt="{{ item.title }}"
            >
          </a>

          <h3>
            <a href="{{ url_for('item.item_detail', item_id=item.id) }}">
              {{ item.title }}
            </a>
          </h3>

          <p class="price">RM {{ '%.2f'|format(item.price or 0) }}</p>

          <p class="description">{{ item.description }}</p>

        </div>
      {% endfor %}
    </div>

  </div>
{% endblock %}
