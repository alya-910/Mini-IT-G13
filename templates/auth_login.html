<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f9f9f9;
            padding: 40px;
        }
        .login-box {
            width: 300px;
            padding: 20px;
            margin: auto;
            background: white;
            box-shadow: 0 0 10px #ccc;
            border-radius: 6px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 8px;
            background: black;
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        {% if get_flashed_messages() %}
            <p style="color:red;">{{ get_flashed_messages()[0] }}</p>
        {% endif %}
    </div>
</body>
</html>
