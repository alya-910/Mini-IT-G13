<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">

<div class="container">
  <h1>Your Cart</h1>

  {% if items %}
  <table class="cart-table">
    <tr>
      <th>Item</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Action</th>
    </tr>

    {% for item, qty in items %}
    <tr>
      <td>{{ item.title }}</td>
      <td>RM {{ '%.2f'|format(item.price) }}</td>
      <td>{{ qty }}</td>
      <td>
        <a class="remove-link" href="{{ url_for('remove_from_cart', item_id=item.id) }}">
          Remove
        </a>
      </td>
    </tr>
    {% endfor %}
  </table>

  <div class="cart-actions">
    <strong>Total: RM {{ '%.2f'|format(total) }}</strong>

    <form action="{{ url_for('checkout') }}" method="post">
      <button class="checkout-btn">Checkout</button>
    </form>
  </div>

  {% else %}
    <p>Your cart is empty.</p>
  {% endif %}
</div>
