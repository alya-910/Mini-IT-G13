<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">

<div class="container">
  <a href="{{ url_for('index') }}" class="cart-button back-button">
   Back
</a>
  <h1>Your Wishlist</h1>

  {% if items %}
  <table class="cart-table">
    <tr>
      <th>Item</th>
      <th>Price</th>
      <th>Action</th>
    </tr>

    {% for item, qty in items %}
    <tr>
      <td>{{ item.title }}</td>
      <td>RM {{ '%.2f'|format(item.price) }}</td>
      <td>
        <a class="remove-link" href="{{ url_for('remove_from_cart', item_id=item.id) }}">
          Remove
        </a>
      </td>
    </tr>
    {% endfor %}
  </table>

  <p class="wishlist-note">
  Items in your wishlist are saved for reference. 
  Contact the seller to purchase an item.
</p>

  {% else %}
    <p>Your Wishlist is empty.</p>
  {% endif %}
</div>
