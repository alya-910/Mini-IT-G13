{% extends 'base.html' %}

{% block head %}
{% endblock %}

{% block body %}

<!-- navigation bar -->
<nav class="navbar">
    <div class="navdiv">
        <div class="logo"><a href="#">Thrifty's</a></div>
        <ul>
            <li><a href="{{ url_for('main.home') }}">Home</a></li>
            <li><a href="#">Undecided</a></li>
            <li><a href="#">Undecided</a></li>
            <button><a href="{{ url_for('auth.login') }}">Log in</a></button>
            <button><a href="{{ url_for('auth.register') }}">Register</a></button>

        </ul>
    </div>
</nav>

<div class="container">
    <h1>
        Hello, 
        {% if username %}
            {{username}}
        {% else %}
            Guest
        {% endif %}
        !
    </h1>
    <h2>Welcome to thrifty's</h2>
    <p>Your thrifting journey awaits!</p>

    <p>
        {% if username %}
        <form action="{{ url_for('auth.logout') }}" method="get">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
        {% endif %}
    </p>
    
</div>

{% endblock %}
