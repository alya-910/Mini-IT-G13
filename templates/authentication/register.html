{% extends 'base.html' %}

{% block body %}

<!-- navigation bar -->
{% include 'includes/navbar.html' %}

<div class="container" id="authentication">
    <h1>Register</h1>
    <h2>Ready to start thrifting? Join now!</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
            <div style="color: white;">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.register') }}" method="POST">

        <label>Username:</label>
        <input
        type="text"
        name="username"
        placeholder="Username"
        required
        /><br><br>

        <label>Email:</label>
        <input
        type="text"
        name="email"
        placeholder="Email"
        required
        /><br><br>

        <label>Password:</label>
        <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
        /><br><br>

        <button type="submit">Register</button>
    </form>

</div>
{% endblock %}
