{% extends 'base.html' %}

{% block body %}

<div class="container" id="authentication">
    <h1>Register</h1>
    <h2>Ready to start thrifting? Join now!</h2>

    <form action="{{ url_for('auth_user.register') }}" method="POST">

        <label>Email:</label>
        <input
        type="email"
        name="email"
        placeholder="Email"
        required
        /><br><br>

        <label>Username:</label>
        <input
        type="text"
        name="username"
        placeholder="Username"
        required
        /><br><br>

        <label>Password:</label>
        <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
        /><br><br>

        <button type="submit" class="auth-btn">Register</button>
    </form>

</div>
{% endblock %}
