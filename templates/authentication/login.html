{% extends 'base.html' %}

{% block body %}

<div class="container" id="authentication">
    <h1>Log in</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
            <div style="color: rgb(0, 0, 0);">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.login') }}" method="POST">
        <label>Email:</label>
        <input
        type="text"
        name="email"
        placeholder="Email"
        required
        />

        <br><br>
        <label>Password:</label>
        <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
        />
        <br><br>

        <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
        <br><br>

        <button type="submit">Login</button>
        <br>

        <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}">Register now!</a></p>
        
    </form>
</div>
{% endblock %}
