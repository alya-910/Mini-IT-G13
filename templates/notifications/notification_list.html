{% extends "base.html" %}
{% block body %}

<div class="container-a">
    <h2>Notifications</h2><br>

    {% if notifs %}
        <ul class="notification-list">
            {% for notif in notifs %}
                <li class="{% if not notif.is_read %}unread{% endif %}">
                    <a href="{{ url_for('notifications.mark_as_read', id=notif.id) }}">
                        {{ notif.message }}
                    </a>
                    <br>
                    <small>{{ notif.created_at.strftime('%d-%m-%Y %H:%M') }}</small>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No new notifications.</p>
    {% endif %}
</div>

{% endblock %}
